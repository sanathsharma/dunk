[package]
name = "dunk"
version = "0.2.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# deny panics
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
clap = "4.6.7"
notify = "8.2.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.1", features = ["unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
toml = "1.2.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
tempfile = "3.27.0"
